name: blackadder-cursor

# Alternative to gh-aw for Cursor CLI: run a Blackadder skill from a `/blackadder …` PR comment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cursor:
    if: startsWith(github.event.comment.body, '/blackadder') || startsWith(github.event.comment.body, '/slice') || startsWith(github.event.comment.body, '/verify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash && echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
      - name: install Blackadder skills for this run
        run: |
          git clone --depth 1 https://github.com/roshanis/blackadder-dlc.git /tmp/blackadder
          mkdir -p .cursor/skills .cursor/agents .cursor/rules .cursor/hooks
          cp -r /tmp/blackadder/skills/* .cursor/skills/
          cp /tmp/blackadder/harness/cursor/agents/*.md .cursor/agents/
          cp /tmp/blackadder/harness/cursor/rules/*.mdc .cursor/rules/
          cp /tmp/blackadder/harness/cursor/hooks.json .cursor/hooks.json
          cp /tmp/blackadder/hooks/scripts/guard.sh .cursor/hooks/blackadder-guard.sh
      - name: run
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: ${{ github.event.comment.body }}
        run: agent -p "$PROMPT" --force --output-format text
