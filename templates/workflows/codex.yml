name: blackadder-codex

# Alternative to gh-aw for Codex: run /verify on every PR opened against main.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: install Blackadder skills for this run
        run: |
          git clone --depth 1 https://github.com/roshanis/blackadder-dlc.git /tmp/blackadder
          mkdir -p .agents/skills .codex/agents
          cp -r /tmp/blackadder/skills/* .agents/skills/
          cp /tmp/blackadder/harness/codex/agents/*.toml .codex/agents/
      - id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: read-only
          prompt: |
            Run the /verify skill (.agents/skills/verify/SKILL.md) against PR #${{ github.event.pull_request.number }}
            at head ${{ github.event.pull_request.head.sha }}. Output only the JSON verdict.
      - uses: actions/github-script@v7
        env:
          VERDICT: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.pull_request.number,
              body: "### Blackadder verify (codex)\n```json\n" + process.env.VERDICT + "\n```"
            })
